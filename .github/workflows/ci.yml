name: Build and package runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Use the daemon builder so the distribution build can resolve the local runtime image.
    steps:
      - uses: actions/checkout@v4
      - name: Test source engine and runtime filesystem
        run: docker build --builder default -f docker/Dockerfile.build --platform ${{ matrix.platform }} --build-arg NATIVE_JOBS=2 --target test-minimal .
      - name: Export runtime artifact
        run: docker build --builder default -f docker/Dockerfile.build --platform ${{ matrix.platform }} --build-arg NATIVE_JOBS=2 --target runtime-artifacts --output type=local,dest=dist/runtime/${{ matrix.arch }} .
      - name: Build ready-to-run runtime image
        run: docker build --builder default -f docker/Dockerfile.build --platform ${{ matrix.platform }} --build-arg NATIVE_JOBS=2 --target runtime -t curl-impersonate-rs:runtime .
      - name: Derive distribution image without source compilation
        run: docker build --builder default --platform ${{ matrix.platform }} --build-arg RUNTIME_IMAGE=curl-impersonate-rs:runtime --network none -t curl-impersonate-rs:local .
      - name: Inspect packaged engine and profiles without network
        run: |
          docker run --rm --network none curl-impersonate-rs:local --version
          docker run --rm --network none curl-impersonate-rs:local --list-profiles
          cat dist/runtime/${{ matrix.arch }}/rootfs/opt/native/engine-build.txt
